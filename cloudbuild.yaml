# NightMaMa — push 到 main 自動建置並部署前後端到 Cloud Run。
#
# 為什麼需要這個檔案：
# 原本的觸發器直接建置 repo，沒有帶 --build-arg 也沒有 --set-env-vars，
# 因此自動部署出來的服務既沒有 Google Maps 瀏覽器金鑰（地圖載不出來），
# 也沒有 BACKEND_URL（安全評分回 503）。
#
# 金鑰一律來自 Secret Manager，不寫在這個檔案裡，也不進 image layer：
#   - 瀏覽器端的 Maps 金鑰在 build 階段以 --build-arg 注入（Next.js 的
#     NEXT_PUBLIC_ 變數必須在 build 時決定，這是無法避免的公開值）。
#   - 伺服器端金鑰一律用 Cloud Run 的 --set-secrets 在 runtime 掛載，
#     不會像 --set-env-vars 那樣明文顯示在服務設定頁。

# 映像標籤用 $BUILD_ID 而不是 $SHORT_SHA：
# SHORT_SHA 只在觸發器建置時有值，手動執行 `gcloud builds submit` 時是空字串，
# 會產生 "gcr.io/<proj>/nightmama-web:" 這種缺標籤的名稱而讓建置失敗。
# BUILD_ID 兩種情況都一定有值，且每次建置唯一、可回查。

substitutions:
  _REGION: asia-east1
  _WEB_SERVICE: nightmama-web
  _API_SERVICE: nightmama-api
  # 前端呼叫後端、後端 CORS 白名單都用得到；服務網址穩定不會變動。
  _API_URL: https://nightmama-api-321739351322.asia-east1.run.app
  _WEB_URL: https://nightmama-web-321739351322.asia-east1.run.app

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/maps-browser-key/versions/latest
      env: MAPS_BROWSER_KEY

options:
  # CLOUD_LOGGING_ONLY 表示日誌只進 Cloud Logging，不寫 Cloud Storage。
  # 副作用：`gcloud builds submit` 只會串流 GCS 的日誌，所以手動執行時
  # 畫面會一路停在 "Waiting for build to complete" 而看不到任何輸出。
  # 想看即時日誌就用 `gcloud beta builds submit`，或在另一個分頁跑：
  #   gcloud builds list --ongoing --format="value(id)" | head -1 \
  #     | xargs -I{} gcloud beta builds log {} --stream
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s

steps:
  # ─── 前端 ────────────────────────────────────────────────────────────
  # 用 bash 而不是 docker builder 的 args，因為 secretEnv 只在 shell 展開。
  - id: build-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: [MAPS_BROWSER_KEY]
    args:
      - -c
      - |
        set -e
        docker build \
          --build-arg NEXT_PUBLIC_GOOGLE_MAPS_KEY="$$MAPS_BROWSER_KEY" \
          -t gcr.io/$PROJECT_ID/$_WEB_SERVICE:$BUILD_ID \
          -t gcr.io/$PROJECT_ID/$_WEB_SERVICE:latest \
          frontend

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, gcr.io/$PROJECT_ID/$_WEB_SERVICE]
    waitFor: [build-web]

  # ─── 後端 ────────────────────────────────────────────────────────────
  # 後端沒有 build 階段的秘密，可以跟前端平行建置。
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/$_API_SERVICE:$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/$_API_SERVICE:latest
      - backend
    waitFor: ['-']

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, gcr.io/$PROJECT_ID/$_API_SERVICE]
    waitFor: [build-api]

  # ─── 部署 ────────────────────────────────────────────────────────────
  # 後端先上，前端才不會有一小段時間指向舊版評分 API。
  #
  # --set-env-vars 用 ^@^ 當分隔符號，因為 CORS_ORIGINS 的 JSON 陣列
  # 若含多個來源會出現逗號，會被預設的逗號分隔規則切壞。
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_API_SERVICE
      - --image=gcr.io/$PROJECT_ID/$_API_SERVICE:$BUILD_ID
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --timeout=60
      - --min-instances=0
      - --max-instances=3
      - --set-env-vars=^@^GCP_PROJECT_ID=$PROJECT_ID@CORS_ORIGINS=["$_WEB_URL"]
      - --set-secrets=GOOGLE_MAPS_API_KEY=maps-server-key:latest
      - --quiet
    waitFor: [push-api]

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_WEB_SERVICE
      - --image=gcr.io/$PROJECT_ID/$_WEB_SERVICE:$BUILD_ID
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --set-env-vars=^@^BACKEND_URL=$_API_URL@APP_BASE_URL=$_WEB_URL
      - --set-secrets=^@^GEMINI_API_KEY=gemini-api-key:latest@LINE_CHANNEL_ACCESS_TOKEN=line-channel-access-token:latest@LINE_LOGIN_CHANNEL_ID=line-login-channel-id:latest@LINE_LOGIN_CHANNEL_SECRET=line-login-channel-secret:latest@INVITE_SIGNING_SECRET=invite-signing-secret:latest
      - --quiet
    waitFor: [push-web, deploy-api]

  # ─── 冒煙測試 ────────────────────────────────────────────────────────
  # 部署完立刻驗證，壞掉的版本才不會靜悄悄地留在正式站上。
  - id: smoke-test
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      # 底下的 shell 變數一律寫成雙錢字號：單一錢字號會被 Cloud Build
      # 當成 substitution key，找不到對應值就整個建置失敗。
      - |
        set -e
        echo "--- 後端 /health ---"
        curl -fsS "$_API_URL/health"
        echo
        echo "--- 前端 /api/score 端到端 ---"
        body=$$(curl -fsS -X POST "$_WEB_URL/api/score" \
          -H 'Content-Type: application/json' \
          -d '{"polylines":["{{zwCwytdVBsEDyFFyFDyFByFDyFDyFrKIBeFB{E"]}')
        echo "$$body"
        # light_count 為 0 代表 BigQuery 沒接上，評分會全部失真
        echo "$$body" | grep -q '"light_count":[1-9]' || {
          echo "冒煙測試失敗：light_count 為 0，BigQuery 參考資料可能未匯入"
          exit 1
        }
        echo "冒煙測試通過"
    waitFor: [deploy-web]

images:
  - gcr.io/$PROJECT_ID/$_WEB_SERVICE:$BUILD_ID
  - gcr.io/$PROJECT_ID/$_API_SERVICE:$BUILD_ID
